name: Build VisionClaw iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create Secrets.swift
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
       run: |
             cp samples/CameraAccess/CameraAccess/Secrets.swift.example samples/CameraAccess/CameraAccess/Secrets.swift
     
      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -resolvePackageDependencies

      - name: Build iOS app
        run: |
          xcodebuild \
            -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package app
        run: |
          cd build/Build/Products/Release-iphoneos
          zip -r "$GITHUB_WORKSPACE/VisionClaw-unsigned.zip" *.app

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-iOS-build
          path: VisionClaw-unsigned.zip
