name: Build VisionClaw iOS

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create Secrets.swift
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_GATEWAY_URL: ${{ secrets.AGENT_GATEWAY_URL }}
          AGENT_GATEWAY_TOKEN: ${{ secrets.AGENT_GATEWAY_TOKEN }}
        run: |
          f=samples/CameraAccess/CameraAccess/Secrets.swift
          cp "$f.example" "$f"
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::GEMINI_API_KEY secret is not set"; exit 1; fi
          sed -i '' "s|YOUR_GEMINI_API_KEY|$GEMINI_API_KEY|" "$f"
          if [ -n "$AGENT_GATEWAY_URL" ]; then sed -i '' "s|https://api.visionagents.app|$AGENT_GATEWAY_URL|" "$f"; fi
          if [ -n "$AGENT_GATEWAY_TOKEN" ]; then sed -i '' "s|static let cloudGatewayToken = \"\"|static let cloudGatewayToken = \"$AGENT_GATEWAY_TOKEN\"|" "$f"; fi

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -resolvePackageDependencies

      - name: Build iOS app
        run: |
          xcodebuild \
            -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry "$GITHUB_WORKSPACE/VisionClaw.ipa" Payload

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-iOS-build
          path: VisionClaw.ipa

      - name: Package full CameraAccess project
        run: |
          zip -r "$GITHUB_WORKSPACE/VisionClaw-CameraAccess-project.zip" samples/CameraAccess

      - name: Upload full CameraAccess project
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-iOS-project
          path: VisionClaw-CameraAccess-project.zip
